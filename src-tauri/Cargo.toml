[package]
name = "mouse-gesture-5btn"
version = "0.1.0"
description = "A modern Windows mouse gesture application with 5-button support"
authors = ["MouseGesture5Btn contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "mouse_gesture_5btn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10.0", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-opener = "2.5.0"
