[package]
name = "conductor"
version = "0.1.4"
description = "A Windows gesture and hotkey conductor"
authors = ["Conductor contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "conductor_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tauri = { version = "2.10.0", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-opener = "2.5.0"

# Enable incremental compilation and lighter optimization to speed up local release rebuilds.
[profile.release]
opt-level = 1
incremental = true
codegen-units = 256
